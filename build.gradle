plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
// Gradle downloads a Java 21 toolchain by itself if none is installed.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Modrinth's maven, for running the game with Create and friends while developing.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // gradlew runClient -PquickPlay="New World (1)" opens that world straight away.
            if (project.hasProperty('quickPlay'))
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': mods present when running the game here, but not dependencies of the finished mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create, plus Create Aeronautics (which brings the "simulated" blocks) and the Sable library it needs.
    // Only for testing schematic import; Snow Globes itself works without them.
    localRuntime "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:sable:${sable_version}"
    localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
